{% extends 'base.html' %}

{% block content %}

<h1>Create a New Question</h1>

<div class="section-box">
    <form method="POST">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Enter your question title..." required>

        <label for="content">Content</label>
        <textarea id="content" name="content" rows="8" placeholder="Describe your question in detail..." required></textarea>

        <div class="flex-container">
            <button type="submit">Submit Question</button>
            <a href="/qna" class="website-button" style="background-color: #718096;">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
